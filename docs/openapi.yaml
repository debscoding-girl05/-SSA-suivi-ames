openapi: 3.1.0
info:
  title: SSA — Suivi des Âmes API
  version: 0.1.0
  description: |
    API REST du projet SSA.
    Authentification par JWT (Bearer token).

servers:
  - url: http://localhost:3000
    description: Développement local
  - url: https://staging.ssa-app.example.com
    description: Staging

tags:
  - name: Auth
    description: Authentification
  - name: Persons
    description: Gestion des personnes suivies
  - name: Notes
    description: Notes pastorales attachées à une personne

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
          example: Token invalide ou expiré

    AuthLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: debora@ssa.app
        password:
          type: string
          format: password
          minLength: 8

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT à inclure dans les requêtes suivantes
        user:
          $ref: '#/components/schemas/UserPublic'

    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, leader, volunteer]

    Person:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          example: Jean
        lastName:
          type: string
          example: Dupont
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        status:
          type: string
          enum: [new, active, inactive]
          default: new
        createdAt:
          type: string
          format: date-time

    PersonCreate:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true

    Note:
      type: object
      required: [id, personId, content]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    NoteCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string

    PaginatedPersons:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogin'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion (invalide le token côté client)
      responses:
        '204':
          description: Déconnexion réussie

  /persons:
    get:
      tags: [Persons]
      summary: Lister les personnes
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPersons'

    post:
      tags: [Persons]
      summary: Créer une personne
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreate'
      responses:
        '201':
          description: Personne créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'

  /persons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Persons]
      summary: Détail d'une personne
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          description: Introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Persons]
      summary: Mettre à jour une personne
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreate'
      responses:
        '200':
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'

    delete:
      tags: [Persons]
      summary: Supprimer une personne
      responses:
        '204':
          description: Supprimé

  /persons/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Notes]
      summary: Notes d'une personne
      responses:
        '200':
          description: Liste des notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'

    post:
      tags: [Notes]
      summary: Ajouter une note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Note créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
